[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudguard"
version = "0.1.0"
description = "Read-only LLM agent that audits an Azure subscription for governance and security risks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Only needed for --live mode against a real subscription. Mock mode and CI need none of these.
live = [
    "azure-identity>=1.15",
    "azure-mgmt-resourcegraph>=8.0",
    # Resource Graph does not index microsoft.authorization/locks; lock data comes from
    # this read-only ARM control-plane client instead (ManagementLockClient).
    "azure-mgmt-resource-locks>=1.0.0",
]
dev = [
    "pytest>=8",
]
# Only needed to actually call an LLM. FakeLLM and the TOOL_SPECS conversion tests need none
# of this, so mock-mode tests and CI stay key-free.
agent = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
cloudguard = "cloudguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real Azure subscription (skipped unless CLOUDGUARD_LIVE_TESTS=1)",
    "live_llm: hits the real Gemini API (skipped unless CLOUDGUARD_LIVE_LLM=1)",
]
