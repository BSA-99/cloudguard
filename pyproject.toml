[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudguard"
version = "0.1.0"
description = "Read-only LLM agent that audits an Azure subscription for governance and security risks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Only needed for --live mode against a real subscription. Mock mode and CI need none of these.
live = [
    "azure-identity>=1.15",
    "azure-mgmt-resourcegraph>=8.0",
]
dev = [
    "pytest>=8",
]

[project.scripts]
cloudguard = "cloudguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real Azure subscription (skipped unless CLOUDGUARD_LIVE_TESTS=1)",
]
