name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDGUARD_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit + safety tests (mock mode, no Azure credentials)
        run: pytest -q
      - name: Baseline detector score vs seeded ground truth
        run: cloudguard --mock check
